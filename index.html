        .jp-typeform-textrow { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
        .jp-typeform-icon { flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; border: 1px solid; display: flex; align-items: center; justify-content: center; }
        .jp-typeform-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .jp-type-icon-badge { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; border: 1px solid; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
        .jp-type-icon-badge-lg { width: 42px; height: 42px; border-radius: 12px; }

        /* ---------- Transit ---------- */
        .jp-transit { display: flex; flex-direction: column; align-items: center; margin: -3px 0 15px; }
        .jp-transit-perf { width: 100%; height: 1px; background-image: radial-gradient(circle, ${LINE} 1.5px, transparent 1.5px); background-size: 10px 1px; background-repeat: repeat-x; }
        .jp-transit-card { background: ${CARD}; border: 1.5px dashed rgba(232,162,61,0.35); border-radius: 15px; padding: 15px 16px; width: 100%; margin: 4px 0; }
        .jp-transit-display { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 0; flex-wrap: nowrap; }
        .jp-transit-icon-btn { flex-shrink: 0; background: none; border: none; padding: 4px; cursor: pointer; color: ${GOLD}; display: flex; align-items: center; justify-content: center; }
        .jp-transit-icon-flight { color: #5FA8D3; }
        .jp-transit-city-text { font-family: 'Frank Ruhl Libre', serif; font-size: 20px; font-weight: 700; background: ${GRADIENT}; -webkit-background-clip: text; background-clip: text; color: transparent; cursor: pointer; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .jp-transit-arrow { color: ${GOLD}; font-size: 17px; flex-shrink: 0; }
        .jp-transit-input { max-width: 40%; min-width: 40px; text-align: center; background: none; border: none; border-bottom: 1.5px solid ${GOLD}; outline: none; font-family: 'Frank Ruhl Libre', serif; font-size: 20px; font-weight: 700; color: ${GOLD}; }

        /* ---------- Place list shared (suggestions) ---------- */
        .jp-place-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 13px; }
        .jp-place { display: flex; gap: 13px; align-items: center; }
        .jp-sugg-item { background: ${CARD}; border: 1px solid ${LINE}; border-inline-start: 3px solid; border-radius: 15px; padding: 15px 16px; }
        .jp-place-body { flex: 1; min-width: 0; }
        .jp-place-title { font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: 19px; color: ${TEXT}; margin-bottom: 9px; }
        .jp-sugg-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
        .jp-add-btn { display: flex; align-items: center; gap: 3px; background: none; border: 1px solid rgba(232,162,61,0.35); color: ${GOLD}; border-radius: 14px; padding: 3px 9px; font-size: 10.5px; font-weight: 700; cursor: pointer; font-family: 'Heebo', sans-serif; }
        .jp-add-done { border-color: transparent; background: rgba(91,148,99,0.25); color: ${GREEN}; }

        /* ---------- Suggestions city pills ---------- */
        .jp-city-pills { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 16px; margin-bottom: 2px; -ms-overflow-style: none; scrollbar-width: none; }
        .jp-city-pills::-webkit-scrollbar { display: none; }
        .jp-city-pill { flex-shrink: 0; background: ${CARD}; border: 1px solid ${LINE}; color: ${TEXT}; border-radius: 20px; padding: 9px 17px; font-size: 14.5px; font-weight: 700; font-family: 'Heebo', sans-serif; cursor: pointer; }
        .jp-city-pill.active { background: ${GRADIENT}; color: #fff; border-color: transparent; }

        /* ---------- Tips ---------- */
        .jp-tip-sec { border-bottom: 1px solid ${LINE}; }
        .jp-tip-head { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 16px 2px; cursor: pointer; font-family: 'Heebo', sans-serif; }
        .jp-tip-title { flex: 1; text-align: right; font-size: 16.5px; font-weight: 700; color: ${TEXT}; }
        .jp-tip-chevron { color: ${MUTED}; transition: transform .2s; flex-shrink: 0; }
        .jp-tip-list { list-style: none; margin: 0; padding: 0 2px 10px; display: flex; flex-direction: column; gap: 11px; }
        .jp-tip-list li { display: flex; align-items: flex-start; gap: 9px; font-size: 14.5px; line-height: 1.6; color: rgba(243,234,220,0.82); }
        .jp-tip-dot { flex-shrink: 0; width: 5px; height: 5px; border-radius: 50%; background: ${GOLD}; margin-top: 8px; }
        .jp-tip-custom-line { color: ${GOLD} !important; }

        /* ---------- Packing ---------- */
        .jp-pack-progress { font-size: 13.5px; color: ${MUTED}; margin-bottom: 16px; font-weight: 600; }
        .jp-pack-list { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
        .jp-pack-item { display: flex; align-items: center; gap: 8px; background: ${CARD}; border: 1px solid ${LINE}; border-radius: 13px; padding: 4px 8px 4px 14px; }
        .jp-pack-row { flex: 1; display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 9px 0; min-width: 0; }
        .jp-pack-checked { opacity: 0.5; }
        .jp-pack-box { flex-shrink: 0; width: 23px; height: 23px; border-radius: 7px; border: 1.5px solid rgba(91,148,99,0.5); display: flex; align-items: center; justify-content: center; color: #fff; }
        .jp-pack-box-on { background: ${GREEN}; border-color: transparent; }
        .jp-pack-text { font-size: 15px; color: ${TEXT}; }
        .jp-pack-checked .jp-pack-text { text-decoration: line-through; }

        @media (min-width: 481px) { .jp-app { border-radius: 24px; margin-top: 20px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); } .jp-splash { border-radius: 24px; } }
